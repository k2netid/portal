# SMKN 6 Bandung Portal staging — ja-dev
# Port: 49280 (RFC 6335 Private Port) & 8080 (IANA http-alt)
# Live: /etc/nginx/sites-available/smkn6-staging -> /etc/nginx/sites-enabled/

server {
    listen 49280 default_server;
    listen [::]:49280 default_server;
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /home/jejakawan/dev/smkn6-portal/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    access_log /var/log/nginx/smkn6-portal.access.log;
    error_log  /var/log/nginx/smkn6-portal.error.log;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 165.99.252.1;

    location /storage {
        alias /home/jejakawan/dev/smkn6-portal/backend/storage/app/public;
        try_files $uri =404;
        access_log off;
    }

    # Static assets cache directly by Nginx (no PHP touch)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        set $smkn6_https off;
        if ($http_x_forwarded_proto = https) {
            set $smkn6_https on;
        }
        fastcgi_param HTTPS $smkn6_https;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
