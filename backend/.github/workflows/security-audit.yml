name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Dependency audit
        run: composer security:smoke-check

      - name: Extension security sandbox
        run: php artisan test Modules/Core/tests/System/Feature/ExtensionSecuritySandboxTest.php --ansi

      - name: Security maintenance
        run: php artisan security:maintenance --ansi
