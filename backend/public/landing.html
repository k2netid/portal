  <title>Portal</title>
  <script>
    window.__JA_SHELL__ = 'landing';
    (function () {
      try {
        var available = ['id', 'en', 'su'];
        var stored = localStorage.getItem('locale');
        var themeDefault = localStorage.getItem('ja_theme_default_locale') || 'id';
        var pick = stored && available.indexOf(stored) !== -1 ? stored : null;
        if (!pick && themeDefault !== 'auto' && available.indexOf(themeDefault) !== -1) {
          pick = themeDefault;
        }
        if (!pick) {
          var langs = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || ''];
          for (var i = 0; i < langs.length; i++) {
            var code = String(langs[i] || '').toLowerCase().split('-')[0];
            if (available.indexOf(code) !== -1) {
              pick = code;
              break;
            }
          }
        }
        if (pick) document.documentElement.lang = pick;
      } catch (e) { /* ignore */ }
    })();
  </script>
