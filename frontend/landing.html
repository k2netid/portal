<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="K2NET — PT Kirana Karina Network" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
  <title>K2NET</title>
  <script>
    window.__JA_SHELL__ = 'landing';
    (function () {
      try {
        var available = ['id', 'en', 'su'];
        var stored = localStorage.getItem('locale');
        var pick = stored && available.indexOf(stored) !== -1 ? stored : null;
        if (!pick) {
          var langs = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || ''];
          for (var i = 0; i < langs.length; i++) {
            var code = String(langs[i] || '').toLowerCase().split('-')[0];
            if (available.indexOf(code) !== -1) {
              pick = code;
              break;
            }
          }
        }
        if (pick) document.documentElement.lang = pick;
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main-landing.ts"></script>
</body>
</html>
